  <style>
    :root {
      --text: #ffffff;
      --muted: rgba(233, 240, 250, 0.72);
      --accent: #6ee7ff;                 /* restrained cyan — hover + cursor only */
      --name-size: clamp(2rem, 6vw, 3.7rem);
      --content-shift: -2vh;
      --font-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: var(--font-sans);
      color: var(--text);
      min-height: 100vh;
      background-color: #0d1526;
      background-image:
        linear-gradient(90deg,
          rgba(3, 7, 14, 0.88) 0%, rgba(3, 7, 14, 0.68) 28%,
          rgba(3, 7, 14, 0.30) 55%, rgba(3, 7, 14, 0.08) 80%, rgba(3, 7, 14, 0.04) 100%),
        linear-gradient(rgba(3, 7, 14, 0.18), rgba(3, 7, 14, 0.30)),
        url("background.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    .overlay {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 24px clamp(26px, 8vw, 120px);
    }
    .content {
      max-width: 680px;
      transform: translateY(var(--content-shift));
      animation: rise 1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(calc(var(--content-shift) + 16px)); }
      to   { opacity: 1; transform: translateY(var(--content-shift)); }
    }

    #name {
      font-size: var(--name-size);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin-bottom: 1rem;
      text-shadow: 0 2px 28px rgba(0, 0, 0, 0.7), 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    .term { font-family: var(--font-mono); text-shadow: 0 1px 14px rgba(0,0,0,0.75); }
    .cmd { color: var(--muted); font-size: clamp(0.82rem, 1.8vw, 1rem); margin-bottom: 0.15rem; }
    .prompt { color: var(--accent); }
    #role {
      font-size: clamp(1.05rem, 2.6vw, 1.5rem);
      font-weight: 500; color: var(--text);
      min-height: 1.5em;
    }
    .cursor { color: var(--accent); animation: blink 1.1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    #spec { color: var(--muted); font-size: clamp(0.82rem, 1.9vw, 1.02rem); margin-top: 0.35rem; }
    #creds {
      font-family: var(--font-mono); color: var(--accent);
      font-size: clamp(0.72rem, 1.5vw, 0.85rem);
      letter-spacing: 0.03em; margin-top: 0.9rem; opacity: 0.92;
      text-shadow: 0 1px 12px rgba(0,0,0,0.7);
    }

    #icons { margin-top: 1.9rem; display: flex; flex-wrap: wrap; gap: 1.5rem; }
    #icons a {
      color: var(--text); opacity: 0.86; display: inline-flex;
      filter: drop-shadow(0 1px 8px rgba(0,0,0,0.6));
      transition: transform 0.2s ease, opacity 0.2s ease, color 0.2s ease;
    }
    #icons a:hover { opacity: 1; color: var(--accent); transform: translateY(-3px); }
    #icons svg { width: 26px; height: 26px; display: block; }

    @media (prefers-reduced-motion: reduce) {
      .content { animation: none; }
      #icons a, .cursor { animation: none; transition: none; }
    }
  </style>
</head>

  <script>
    (function () {
      var el = document.getElementById('typed');
      if (!el) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var full = el.textContent, i = 0;
      el.textContent = '';
      (function tick() {
        el.textContent = full.slice(0, i);
        if (i++ <= full.length) setTimeout(tick, 42);
      })();
    })();
